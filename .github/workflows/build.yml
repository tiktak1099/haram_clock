name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project with Haram Clock Icon
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "HourlyChimeApp"
          include ':app'
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.hourlychime'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.hourlychime"
                  minSdk 23
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }
          EOF

          # 4. طراحي آیکون وکتور اختصاصی ساعت حرم مطهر (ic_launcher.xml)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- پس‌زمینه فیروزه‌ای تیره -->
              <path
                  android:pathData="M0,0h108v108h-108z"
                  android:fillColor="#042F2E" />

              <!-- هاله نورانی گنبد و حریم حرم -->
              <path
                  android:pathData="M54,54m-46,0a46,46 0,1,1 92,0a46,46 0,1,1 -92,0"
                  android:fillColor="#0F766E" />

              <!-- بدنه و ایوان برج ساعت حرم -->
              <path
                  android:pathData="M34,42 L74,42 L70,96 L38,96 Z"
                  android:fillColor="#115E59" />

              <!-- قاب و کنگره‌های طلایی سنتی بالای ساعت -->
              <path
                  android:pathData="M30,42 L78,42 L74,34 L34,34 Z"
                  android:fillColor="#D97706" />

              <!-- گنبدک طلایی روی برج ساعت -->
              <path
                  android:pathData="M44,34 Q54,16 64,34 Z"
                  android:fillColor="#F59E0B" />
              <path
                  android:pathData="M53,16 L55,16 L54,10 Z"
                  android:fillColor="#FDE047" />

              <!-- صفحه گرد ساعت حرم -->
              <path
                  android:pathData="M54,64m-18,0a18,18 0,1,1 36,0a18,18 0,1,1 -36,0"
                  android:fillColor="#FEF3C7" />

              <!-- حاشیه طلایی دور ساعت -->
              <path
                  android:pathData="M54,64m-18,0a18,18 0,1,1 36,0a18,18 0,1,1 -36,0"
                  android:strokeColor="#D97706"
                  android:strokeWidth="2.5" />

              <!-- عقربه‌های ساعت حرم روی ساعت ۳ -->
              <path
                  android:pathData="M54,64 L54,52"
                  android:strokeColor="#78350F"
                  android:strokeWidth="2.5"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M54,64 L64,64"
                  android:strokeColor="#78350F"
                  android:strokeWidth="2.5"
                  android:strokeLineCap="round" />

              <!-- مرکز عقربه‌ها -->
              <path
                  android:pathData="M54,64m-2,0a2,2 0,1,1 4,0a2,2 0,1,1 -4,0"
                  android:fillColor="#B45309" />
          </vector>
          EOF

          # 5. AndroidManifest.xml متصل به آیکون جدید
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_haram"
                  android:label="ساعت حرم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".HourlyChimeReceiver"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          # 6. MainActivity.kt با Activity خالص
          cat << 'EOF' > app/src/main/java/com/example/hourlychime/MainActivity.kt
          package com.example.hourlychime

          import android.app.Activity
          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.LinearLayout
          import android.widget.Spinner
          import android.widget.TextView
          import android.widget.Toast
          import java.util.Calendar
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity : Activity() {

              private val PICK_AUDIO_REQUEST = 999

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setBackgroundColor(Color.parseColor("#042F2E"))
                      setPadding(40, 50, 40, 50)
                  }

                  val title = TextView(this).apply {
                      text = "ساعت حرم امام رضا (ع)"
                      textSize = 22f
                      setTextColor(Color.parseColor("#FDE047"))
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 20)
                  }

                  val statusText = TextView(this).apply {
                      val active = prefs.getBoolean("is_alarm_active", false)
                      text = if (active) "وضعیت: فعال (پخش سر هر ساعت)" else "وضعیت: غیرفعال"
                      textSize = 15f
                      setTextColor(if (active) Color.parseColor("#4ADE80") else Color.parseColor("#94A3B8"))
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 30)
                  }

                  val btnToggle = Button(this).apply {
                      val isActive = prefs.getBoolean("is_alarm_active", false)
                      text = if (isActive) "خاموش کردن زنگ" else "روشن کردن زنگ ساعتی"
                      setBackgroundColor(if (isActive) Color.parseColor("#DC2626") else Color.parseColor("#0D9488"))
                      setTextColor(Color.WHITE)

                      setOnClickListener {
                          val currentState = prefs.getBoolean("is_alarm_active", false)
                          val newState = !currentState
                          prefs.edit().putBoolean("is_alarm_active", newState).apply()

                          if (newState) {
                              HourlyChimeReceiver.scheduleNextChime(this@MainActivity)
                              text = "خاموش کردن زنگ"
                              setBackgroundColor(Color.parseColor("#DC2626"))
                              statusText.text = "وضعیت: فعال (پخش سر هر ساعت)"
                              statusText.setTextColor(Color.parseColor("#4ADE80"))
                              Toast.makeText(this@MainActivity, "زنگ ساعتی فعال شد", Toast.LENGTH_SHORT).show()
                          } else {
                              HourlyChimeReceiver.cancelChime(this@MainActivity)
                              text = "روشن کردن زنگ ساعتی"
                              setBackgroundColor(Color.parseColor("#0D9488"))
                              statusText.text = "وضعیت: غیرفعال"
                              statusText.setTextColor(Color.parseColor("#94A3B8"))
                              Toast.makeText(this@MainActivity, "زنگ غیرفعال شد", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }

                  val chkQuiet = CheckBox(this).apply {
                      text = "حالت بی‌صدا در شب (۲۳:۰۰ الی ۰۷:۰۰)"
                      setTextColor(Color.parseColor("#E2E8F0"))
                      isChecked = prefs.getBoolean("quiet_enabled", true)
                      setPadding(0, 20, 0, 20)
                      setOnCheckedChangeListener { _, checked ->
                          prefs.edit().putBoolean("quiet_enabled", checked).apply()
                      }
                  }

                  val soundLabel = TextView(this).apply {
                      text = "انتخاب نوای زنگ:"
                      setTextColor(Color.parseColor("#99F6E4"))
                      textSize = 14f
                      setPadding(0, 20, 0, 10)
                  }

                  val soundOptions = arrayOf("زنگ ناقوس ساعت حرم (اصلی)", "ساعت پاندولی کلاسیک", "بیپ آرام", "فایل صوتی انتخابی از گوشی")
                  val spinner = Spinner(this).apply {
                      val adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, soundOptions)
                      setAdapter(adapter)
                      setSelection(prefs.getInt("sound_type", 0))
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: android.view.View?, pos: Int, id: Long) {
                              prefs.edit().putInt("sound_type", pos).apply()
                          }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }

                  val btnPickAudio = Button(this).apply {
                      text = "انتخاب فایل صوتی دلخواه..."
                      setBackgroundColor(Color.parseColor("#115E59"))
                      setTextColor(Color.parseColor("#FDE047"))
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              addCategory(Intent.CATEGORY_OPENABLE)
                              type = "audio/*"
                          }
                          startActivityForResult(intent, PICK_AUDIO_REQUEST)
                      }
                  }

                  val btnTest = Button(this).apply {
                      text = "تست صدای ساعت جاری"
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setTextColor(Color.parseColor("#CBD5E1"))
                      setOnClickListener {
                          val count = when (val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) % 12) {
                              0 -> 12
                              else -> h
                          }
                          Toast.makeText(this@MainActivity, "پخش $count ضربه زنگ...", Toast.LENGTH_SHORT).show()
                          HourlyChimeReceiver.playChime(this@MainActivity, count)
                      }
                  }

                  root.addView(title)
                  root.addView(statusText)
                  root.addView(btnToggle)
                  root.addView(chkQuiet)
                  root.addView(soundLabel)
                  root.addView(spinner)
                  root.addView(btnPickAudio)
                  root.addView(btnTest)

                  setContentView(root)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_AUDIO_REQUEST && resultCode == Activity.RESULT_OK) {
                      data?.data?.let { uri ->
                          try {
                              contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          } catch (_: Exception) {}
                          val prefs = getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                          prefs.edit()
                              .putString("custom_audio_uri", uri.toString())
                              .putInt("sound_type", 3)
                              .apply()
                          Toast.makeText(this, "فایل صوتی ذخیره شد", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }

          class HourlyChimeReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val hour24 = Calendar.getInstance().get(Calendar.HOUR_OF_DAY)
                  if (!isQuietHour(context, hour24)) {
                      val count = when (val h = hour24 % 12) {
                          0 -> 12
                          else -> h
                      }
                      playChime(context, count)
                  }
                  scheduleNextChime(context)
              }

              private fun isQuietHour(context: Context, currentHour: Int): Boolean {
                  val prefs = context.getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("quiet_enabled", true)) return false
                  val start = prefs.getInt("quiet_start", 23)
                  val end = prefs.getInt("quiet_end", 7)
                  return currentHour >= start || currentHour < end
              }

              companion object {
                  fun playChime(context: Context, totalRounds: Int) {
                      val prefs = context.getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                      val type = prefs.getInt("sound_type", 0)
                      val uriStr = prefs.getString("custom_audio_uri", null)

                      thread {
                          for (i in 0 until totalRounds) {
                              if (type == 3 && uriStr != null) {
                                  try {
                                      val mp = MediaPlayer.create(context, Uri.parse(uriStr))
                                      mp?.start()
                                      Thread.sleep((mp?.duration?.toLong() ?: 1500L).coerceAtLeast(1000L))
                                      mp?.release()
                                  } catch (e: Exception) {
                                      playSynthesizedTone(587.33, 3.8)
                                      Thread.sleep(1200)
                                  }
                              } else {
                                  when (type) {
                                      1 -> playSynthesizedTone(440.0, 2.5)
                                      2 -> playSynthesizedTone(880.0, 8.0)
                                      else -> playSynthesizedTone(587.33, 3.8)
                                  }
                                  Thread.sleep(1200)
                              }
                          }
                      }
                  }

                  private fun playSynthesizedTone(freq: Double, decay: Double) {
                      val sampleRate = 44100
                      val duration = 1.1
                      val numSamples = (duration * sampleRate).toInt()
                      val buffer = ShortArray(numSamples)

                      for (i in 0 until numSamples) {
                          val t = i.toDouble() / sampleRate
                          val envelope = Math.exp(-decay * t)
                          val sample = sin(2 * Math.PI * freq * t) * envelope
                          buffer[i] = (sample * 32767).toInt().toShort()
                      }

                      val track = AudioTrack.Builder()
                          .setAudioAttributes(
                              AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_ALARM)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build()
                          )
                          .setAudioFormat(
                              AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(sampleRate)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build()
                          )
                          .setBufferSizeInBytes(numSamples * 2)
                          .setTransferMode(AudioTrack.MODE_STATIC)
                          .build()

                      track.write(buffer, 0, numSamples)
                      track.play()
                      Thread.sleep(1100)
                      track.release()
                  }

                  fun scheduleNextChime(context: Context) {
                      val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, HourlyChimeReceiver::class.java)
                      val pendingIntent = PendingIntent.getBroadcast(
                          context, 1001, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      val cal = Calendar.getInstance().apply {
                          add(Calendar.HOUR_OF_DAY, 1)
                          set(Calendar.MINUTE, 0)
                          set(Calendar.SECOND, 0)
                          set(Calendar.MILLISECOND, 0)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pendingIntent)
                      } else {
                          alarmManager.setExact(AlarmManager.RTC_WAKEUP, cal.timeInMillis, pendingIntent)
                      }
                  }

                  fun cancelChime(context: Context) {
                      val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val intent = Intent(context, HourlyChimeReceiver::class.java)
                      val pendingIntent = PendingIntent.getBroadcast(
                          context, 1001, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      alarmManager.cancel(pendingIntent)
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED || intent.action == "android.intent.action.QUICKBOOT_POWERON") {
                      val prefs = context.getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                      if (prefs.getBoolean("is_alarm_active", false)) {
                          HourlyChimeReceiver.scheduleNextChime(context)
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaramClock-WithIcon-APK
          path: app/build/outputs/apk/debug/*.apk
