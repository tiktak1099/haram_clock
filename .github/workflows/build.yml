name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Generate Code and Build
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          rootProject.name = "HourlyChimeApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hourlychime'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.hourlychime"
                  minSdk 23
                  targetSdk 34
                  versionCode 13
                  versionName "2.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          EOF

          # آیکون ساعت حرم - الهام‌گرفته دقیق از عکس با زمینه سفید
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <!-- پس‌زمینه سفید -->
              <path android:pathData="M0,0h108v108h-108z" android:fillColor="#FFFFFF" />

              <!-- میله و گلدسته بالای گنبد -->
              <path android:pathData="M54,2 L54,16" android:strokeColor="#64748B" android:strokeWidth="1.8" />
              <path android:pathData="M54,4m-2,0a2,2 0,1,1 4,0a2,2 0,1,1 -4,0" android:fillColor="#475569" />
              <path android:pathData="M54,8m-2.5,0a2.5,2.5 0,1,1 5,0a2.5,2.5 0,1,1 -5,0" android:fillColor="#475569" />

              <!-- گنبد فیروزه‌ای پیازی -->
              <path android:pathData="M32,38 C32,18 42,14 54,14 C66,14 76,18 76,38 Z" android:fillColor="#0284C7" />
              <!-- نقوش اسلیمی و گره‌چینی روی گنبد -->
              <path android:pathData="M38,34 C46,20 62,20 70,34 M44,20 C50,30 58,30 64,20" android:strokeColor="#FFFFFF" android:strokeWidth="1.4" android:fillColor="#00000000" />

              <!-- طوق طلایی گردن گنبد -->
              <path android:pathData="M31,38 L77,38 L75,41 L33,41 Z" android:fillColor="#D97706" />

              <!-- اتاقک اذان‌گو -->
              <path android:pathData="M33,41 L75,41 L73,56 L35,56 Z" android:fillColor="#1E3A8A" />
              <!-- بلندگوهای حرم در طرفین -->
              <path android:pathData="M27,47 L33,45 L33,52 Z" android:fillColor="#64748B" />
              <path android:pathData="M81,47 L75,45 L75,52 Z" android:fillColor="#64748B" />

              <!-- بالکن بالایی با نرده مشبک سفید -->
              <path android:pathData="M25,56 L83,56 L81,60 L27,60 Z" android:fillColor="#F1F5F9" />
              <path android:pathData="M25,56 L83,56" android:strokeColor="#94A3B8" android:strokeWidth="1.5" />

              <!-- بدنه ۸ ضلعی ساعت با کاشی‌های لاجوردی -->
              <path android:pathData="M35,60 L73,60 L69,89 L39,89 Z" android:fillColor="#1D4ED8" />

              <!-- پنجره‌های باریک طرفین ساعت -->
              <path android:pathData="M38,69 L42,69 L42,82 L38,82 Z" android:fillColor="#BAE6FD" />
              <path android:pathData="M66,69 L70,69 L70,82 L66,82 Z" android:fillColor="#BAE6FD" />

              <!-- صفحه گرد ساعت سفید -->
              <path android:pathData="M54,76m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0" android:fillColor="#FFFFFF" />
              <path android:pathData="M54,76m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0" android:strokeColor="#F59E0B" android:strokeWidth="2.2" />

              <!-- عقربه‌ها -->
              <path android:pathData="M54,76 L54,68" android:strokeColor="#0F172A" android:strokeWidth="2.2" android:strokeLineCap="round" />
              <path android:pathData="M54,76 L62,76" android:strokeColor="#0F172A" android:strokeWidth="2" android:strokeLineCap="round" />
              <path android:pathData="M54,76m-1.5,0a1.5,1.5 0,1,1 3,0a1.5,1.5 0,1,1 -3,0" android:fillColor="#B45309" />

              <!-- بالکن پایینی و مقرنس‌ها -->
              <path android:pathData="M23,89 L85,89 L79,100 L29,100 Z" android:fillColor="#0284C7" />
              <path android:pathData="M23,89 L85,89" android:strokeColor="#F8FAFC" android:strokeWidth="2" />
          </vector>
          EOF

          # پس‌زمینه گرافیکی با افکت تصویر تار حرم
          cat << 'EOF' > app/src/main/res/drawable/bg_blurred_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="360dp" android:height="640dp"
              android:viewportWidth="360" android:viewportHeight="640">
              <!-- رنگ زمینه آسمان تیره -->
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#091427" />
              <!-- سیلوئت تار شده و هاله گنبد فیروزه‌ای در عمق -->
              <path android:pathData="M180,260m-130,0a130,130 0,1,1 260,0a130,130 0,1,1 -260,0" android:fillColor="#152642" />
              <path android:pathData="M110,220 C110,90 145,70 180,70 C215,70 250,90 250,220 Z" android:fillColor="#1E3E62" />
              <path android:pathData="M120,220 L240,220 L225,500 L135,500 Z" android:fillColor="#132B47" />
              <!-- هاله طلایی ساعت در پس‌زمینه مات -->
              <path android:pathData="M180,360m-50,0a50,50 0,1,1 100,0a50,50 0,1,1 -100,0" android:fillColor="#243328" />
              <!-- لایه تار و مات کلی شیشه‌ای (Glassmorphism Tint) -->
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#B80B1C33" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_haram"
                  android:label="ساعت حرم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".HourlyReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/hourlychime/MainActivity.kt
          package com.example.hourlychime
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.Gravity
          import android.widget.*
          import java.util.Calendar
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity : Activity() {
              private val REQ = 999
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("P", 0)

                  // استفاده از تصویر پس‌زمینه تار برج حرم
                  val sv = ScrollView(this).apply {
                      setBackgroundResource(resources.getIdentifier("bg_blurred_haram", "drawable", packageName))
                      isFillViewport = true
                  }

                  val ll = LinearLayout(this).apply {
                      orientation = 1
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(40, 50, 40, 50)
                  }

                  val t = TextView(this).apply {
                      text = "ساعت حرم امام رضا (ع)"
                      textSize = 22f
                      setTextColor(Color.parseColor("#38BDF8"))
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = 1
                  }

                  val st = TextView(this).apply {
                      text = if (p.getBoolean("on", false)) "وضعیت: فعال (سر ساعت و نیم‌ساعت)" else "وضعیت: غیرفعال"
                      textSize = 15f
                      setTextColor(if (p.getBoolean("on", false)) Color.parseColor("#4ADE80") else Color.parseColor("#94A3B8"))
                      gravity = 1
                      setPadding(0, 10, 0, 25)
                  }

                  val btn = Button(this).apply {
                      val on = p.getBoolean("on", false)
                      text = if (on) "خاموش کردن زنگ" else "روشن کردن زنگ ساعتی"
                      setBackgroundColor(if (on) Color.parseColor("#DC2626") else Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          val n = !p.getBoolean("on", false)
                          p.edit().putBoolean("on", n).apply()
                          if (n) {
                              HourlyReceiver.sch(this@MainActivity)
                              text = "خاموش کردن زنگ"
                              setBackgroundColor(Color.parseColor("#DC2626"))
                              st.text = "وضعیت: فعال (سر ساعت و نیم‌ساعت)"
                              st.setTextColor(Color.parseColor("#4ADE80"))
                          } else {
                              HourlyReceiver.can(this@MainActivity)
                              text = "روشن کردن زنگ ساعتی"
                              setBackgroundColor(Color.parseColor("#0284C7"))
                              st.text = "وضعیت: غیرفعال"
                              st.setTextColor(Color.parseColor("#94A3B8"))
                          }
                      }
                  }

                  val ch = CheckBox(this).apply {
                      text = "تک‌زنگ در دقیقه ۳۰ (نیم‌ساعت)"
                      setTextColor(Color.parseColor("#FDE047"))
                      isChecked = p.getBoolean("half", true)
                      setOnCheckedChangeListener { _, c -> p.edit().putBoolean("half", c).apply() }
                  }

                  val cq = CheckBox(this).apply {
                      text = "بی‌صدا در شب (۲۳:۰۰ الی ۰۷:۰۰)"
                      setTextColor(Color.parseColor("#E2E8F0"))
                      isChecked = p.getBoolean("q", true)
                      setOnCheckedChangeListener { _, c -> p.edit().putBoolean("q", c).apply() }
                  }

                  val spSnd = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("ناقوس ساعت حرم", "پاندولی کلاسیک", "بیپ آرام", "فایل دلخواه گوشی"))
                      setSelection(p.getInt("snd", 0))
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: android.view.View?, pos: Int, id: Long) { p.edit().putInt("snd", pos).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }

                  val vals = longArrayOf(0L, 500L, 1000L, 1500L, 2000L)
                  val spGap = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("بدون فاصله (۰ ثانیه)", "۰.۵ ثانیه", "۱ ثانیه", "۱.۵ ثانیه", "۲ ثانیه"))
                      var idx = 2; val cur = p.getLong("gap", 1000L)
                      for (i in vals.indices) if (vals[i] == cur) idx = i
                      setSelection(idx)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: android.view.View?, pos: Int, id: Long) { p.edit().putLong("gap", vals[pos]).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }

                  val btnF = Button(this).apply {
                      text = "انتخاب فایل صوتی دلخواه..."
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setTextColor(Color.parseColor("#38BDF8"))
                      setOnClickListener { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ) }
                  }

                  val btnT = Button(this).apply {
                      text = "تست صدای ساعت جاری"
                      setBackgroundColor(Color.parseColor("#334155"))
                      setTextColor(Color.WHITE)
                      setOnClickListener { val h = Calendar.getInstance().get(11) % 12; HourlyReceiver.play(this@MainActivity, if (h == 0) 12 else h) }
                  }

                  val btnTH = Button(this).apply {
                      text = "تست تک‌زنگ نیم‌ساعت"
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setTextColor(Color.parseColor("#FDE047"))
                      setOnClickListener { HourlyReceiver.play(this@MainActivity, 1) }
                  }

                  ll.addView(t); ll.addView(st); ll.addView(btn); ll.addView(ch); ll.addView(cq)
                  ll.addView(spSnd); ll.addView(spGap); ll.addView(btnF); ll.addView(btnT); ll.addView(btnTH)
                  sv.addView(ll); setContentView(sv)
              }

              override fun onActivityResult(req: Int, res: Int, d: Intent?) {
                  super.onActivityResult(req, res, d)
                  if (req == REQ && res == RESULT_OK) {
                      d?.data?.let { uri ->
                          try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                          getSharedPreferences("P", 0).edit().putString("uri", uri.toString()).putInt("snd", 3).apply()
                          Toast.makeText(this, "فایل صوتی ذخیره شد", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }

          class HourlyReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val cal = Calendar.getInstance()
                  val h = cal.get(11); val m = cal.get(12)
                  val p = c.getSharedPreferences("P", 0)
                  if (!(p.getBoolean("q", true) && (h >= 23 || h < 7))) {
                      if (m in 25..35) { if (p.getBoolean("half", true)) play(c, 1) }
                      else { val c12 = h % 12; play(c, if (c12 == 0) 12 else c12) }
                  }
                  sch(c)
              }
              companion object {
                  fun play(c: Context, r: Int) {
                      val p = c.getSharedPreferences("P", 0)
                      val s = p.getInt("snd", 0); val u = p.getString("uri", null); val g = p.getLong("gap", 1000L)
                      thread {
                          for (idx in 0 until r) {
                              if (s == 3 && u != null) {
                                  try {
                                      val mp = MediaPlayer.create(c, Uri.parse(u))
                                      mp?.start()
                                      Thread.sleep((mp?.duration?.toLong() ?: 1000L) + g)
                                      mp?.release()
                                  } catch (_: Exception) { sndTone(587.33, g) }
                              } else {
                                  sndTone(if (s == 1) 440.0 else if (s == 2) 880.0 else 587.33, g)
                              }
                          }
                      }
                  }
                  private fun sndTone(f: Double, g: Long) {
                      val sr = 44100; val dur = 0.8; val n = (dur * sr).toInt(); val b = ShortArray(n)
                      for (i in 0 until n) { val t = i.toDouble() / sr; b[i] = (sin(2 * Math.PI * f * t) * Math.exp(-3.5 * t) * 32767).toInt().toShort() }
                      val tr = AudioTrack.Builder().setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(n * 2).setTransferMode(AudioTrack.MODE_STATIC).build()
                      tr.write(b, 0, n); tr.play(); Thread.sleep((dur * 1000).toLong() + g); tr.release()
                  }
                  fun sch(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val pi = PendingIntent.getBroadcast(c, 101, Intent(c, HourlyReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val next = Calendar.getInstance().apply {
                          set(13, 0); set(14, 0)
                          if (get(12) < 30) set(12, 30) else { add(11, 1); set(12, 0) }
                      }
                      if (Build.VERSION.SDK_INT >= 23) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                      else am.setExact(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                  }
                  fun can(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      am.cancel(PendingIntent.getBroadcast(c, 101, Intent(c, HourlyReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action == Intent.ACTION_BOOT_COMPLETED && c.getSharedPreferences("P", 0).getBoolean("on", false)) {
                      HourlyReceiver.sch(c)
                  }
              }
          }
          EOF

      - name: Build Debug APK
    
