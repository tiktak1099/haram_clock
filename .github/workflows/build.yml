name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build App Project
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime
          mkdir -p app/src/main/res/drawable

          cat << 'EOF' > settings.gradle
          rootProject.name = "HourlyChimeApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hourlychime'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.hourlychime"
                  minSdk 23
                  targetSdk 34
                  versionCode 11
                  versionName "2.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          EOF

          # آیکون برج ساعت حرم با پس‌زمینه کاملاً سفید
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <!-- پس زمینه کاملاً سفید -->
              <path
                  android:pathData="M0,0h108v108h-108z"
                  android:fillColor="#FFFFFF" />

              <!-- میله و هلال بالای گنبد -->
              <path
                  android:pathData="M54,4 L54,16"
                  android:strokeColor="#64748B"
                  android:strokeWidth="1.8" />
              <path
                  android:pathData="M54,6m-2,0a2,2 0,1,1 4,0a2,2 0,1,1 -4,0"
                  android:fillColor="#475569" />

              <!-- گنبد فیروزه‌ای پیازی حرم مطهر -->
              <path
                  android:pathData="M34,36 C34,20 44,15 54,15 C64,15 74,20 74,36 Z"
                  android:fillColor="#0EA5E9" />

              <!-- خطوط اسلیمی و گره‌چینی سفید روی گنبد -->
              <path
                  android:pathData="M40,32 C48,22 60,22 68,32 M44,22 C50,30 58,30 64,22"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="1.2"
                  android:fillColor="#00000000" />

              <!-- کتیبه طلایی دور گردن گنبد -->
              <path
                  android:pathData="M33,36 L75,36 L73,39 L35,39 Z"
                  android:fillColor="#D97706" />

              <!-- اتاقک اذان‌گو با پنجره‌های هلالی لاجوردی -->
              <path
                  android:pathData="M35,39 L73,39 L71,55 L37,55 Z"
                  android:fillColor="#1E3A8A" />

              <!-- بالکن بالایی با نرده‌های سفید مشبک -->
              <path
                  android:pathData="M27,55 L81,55 L79,59 L29,59 Z"
                  android:fillColor="#E2E8F0" />
              <path
                  android:pathData="M27,55 L81,55"
                  android:strokeColor="#94A3B8"
                  android:strokeWidth="1" />

              <!-- برج ۸ ضلعی ساعت با کاشی‌های لاجوردی و فیروزه‌ای -->
              <path
                  android:pathData="M36,59 L72,59 L68,88 L40,88 Z"
                  android:fillColor="#1D4ED8" />

              <!-- پنجره‌های باریک دو طرف ساعت -->
              <path
                  android:pathData="M39,69 L43,69 L43,81 L39,81 Z"
                  android:fillColor="#BAE6FD" />
              <path
                  android:pathData="M65,69 L69,69 L69,81 L65,81 Z"
                  android:fillColor="#BAE6FD" />

              <!-- قاب و صفحه سفید ساعت حرم -->
              <path
                  android:pathData="M54,75m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0"
                  android:fillColor="#FFFBEB" />
              <path
                  android:pathData="M54,75m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0"
                  android:strokeColor="#D97706"
                  android:strokeWidth="2" />

              <!-- عقربه‌های ساعت حرم -->
              <path
                  android:pathData="M54,75 L54,67"
                  android:strokeColor="#0F172A"
                  android:strokeWidth="2"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M54,75 L61,75"
                  android:strokeColor="#0F172A"
                  android:strokeWidth="1.8"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M54,75m-1.5,0a1.5,1.5 0,1,1 3,0a1.5,1.5 0,1,1 -3,0"
                  android:fillColor="#78350F" />

              <!-- مقرنس‌ها و بالکن پایینی مناره ساعت -->
              <path
                  android:pathData="M25,88 L83,88 L77,98 L31,98 Z"
                  android:fillColor="#0284C7" />
              <path
                  android:pathData="M25,88 L83,88"
                  android:strokeColor="#E2E8F0"
                  android:strokeWidth="2" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_haram"
                  android:label="ساعت حرم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".HourlyReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/hourlychime/MainActivity.kt
          package com.example.hourlychime
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.Gravity
          import android.widget.*
          import java.util.Calendar
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity : Activity() {
              private val REQ_AUDIO = 999
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                  val scroll = ScrollView(this).apply { setBackgroundColor(Color.parseColor("#0C2340")); isFillViewport = true }
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL; setPadding(40, 50, 40, 50) }
                  val title = TextView(this).apply { text = "ساعت حرم امام رضا (ع)"; textSize = 22f; setTextColor(Color.parseColor("#38BDF8")); typeface = Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER; setPadding(0, 0, 0, 20) }
                  val statusText = TextView(this).apply {
                      val a = prefs.getBoolean("active", false)
                      text = if (a) "وضعیت: فعال (سر ساعت و نیم‌ساعت)" else "وضعیت: غیرفعال"
                      textSize = 15f; setTextColor(if (a) Color.parseColor("#4ADE80") else Color.parseColor("#94A3B8")); gravity = Gravity.CENTER; setPadding(0, 0, 0, 30)
                  }
                  val btnToggle = Button(this).apply {
                      val a = prefs.getBoolean("active", false)
                      text = if (a) "خاموش کردن زنگ" else "روشن کردن زنگ ساعتی"
                      setBackgroundColor(if (a) Color.parseColor("#DC2626") else Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          val n = !prefs.getBoolean("active", false)
                          prefs.edit().putBoolean("active", n).apply()
                          if (n) {
                              HourlyReceiver.schedule(this@MainActivity)
                              text = "خاموش کردن زنگ"; setBackgroundColor(Color.parseColor("#DC2626"))
                              statusText.text = "وضعیت: فعال (سر ساعت و نیم‌ساعت)"; statusText.setTextColor(Color.parseColor("#4ADE80"))
                          } else {
                              HourlyReceiver.cancel(this@MainActivity)
                              text = "روشن کردن زنگ ساعتی"; setBackgroundColor(Color.parseColor("#0284C7"))
                              statusText.text = "وضعیت: غیرفعال"; statusText.setTextColor(Color.parseColor("#94A3B8"))
                          }
                      }
                  }
                  val chkHalf = CheckBox(this).apply {
                      text = "تک‌زنگ در دقیقه ۳۰ (نیم‌ساعت)"; setTextColor(Color.parseColor("#FDE047")); isChecked = prefs.getBoolean("half_hour", true); setPadding(0, 20, 0, 10)
                      setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("half_hour", c).apply() }
                  }
                  val chkQuiet = CheckBox(this).apply {
                      text = "بی‌صدا در شب (۲۳:۰۰ الی ۰۷:۰۰)"; setTextColor(Color.parseColor("#E2E8F0")); isChecked = prefs.getBoolean("quiet", true); setPadding(0, 5, 0, 20)
                      setOnCheckedChangeListener { _, c -> prefs.edit().putBoolean("quiet", c).apply() }
                  }
                  val soundLabel = TextView(this).apply {
                      text = "انتخاب نوای زنگ:"; setTextColor(Color.parseColor("#BAE6FD")); setPadding(0, 15, 0, 5)
                  }
                  val spSound = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("ناقوس ساعت حرم", "پاندولی سنتی", "بیپ آرام", "فایل صوتی شخصی"))
                      setSelection(prefs.getInt("snd_type", 0))
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: android.view.View?, pos: Int, id: Long) { prefs.edit().putInt("snd_type", pos).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }
                  val intervalLabel = TextView(this).apply {
                      text = "فاصله بین ضربات:"; setTextColor(Color.parseColor("#BAE6FD")); setPadding(0, 15, 0, 5)
                  }
                  val intervalVals = longArrayOf(0L, 500L, 1000L, 1500L, 2000L)
                  val spInterval = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("بدون فاصله (۰ ثانیه)", "۰.۵ ثانیه", "۱ ثانیه", "۱.۵ ثانیه", "۲ ثانیه"))
                      val saved = prefs.getLong("interval", 1000L)
                      var idx = 2
                      for (i in intervalVals.indices) { if (intervalVals[i] == saved) idx = i }
                      setSelection(idx)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, p1: android.view.View?, pos: Int, id: Long) { prefs.edit().putLong("interval", intervalVals[pos]).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }
                  val btnFile = Button(this).apply {
                      text = "انتخاب فایل صوتی از گوشی..."; setBackgroundColor(Color.parseColor("#1E293B")); setTextColor(Color.parseColor("#38BDF8"))
                      setOnClickListener { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ_AUDIO) }
                  }
                  val btnTest = Button(this).apply {
                      text = "تست صدای ساعت جاری"; setBackgroundColor(Color.parseColor("#334155")); setTextColor(Color.WHITE)
                      setOnClickListener {
                          val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) % 12
                          HourlyReceiver.play(this@MainActivity, if (h == 0) 12 else h)
                      }
                  }
                  val btnTestHalf = Button(this).apply {
                      text = "تست تک‌زنگ نیم‌ساعت"; setBackgroundColor(Color.parseColor("#1E293B")); setTextColor(Color.parseColor("#FDE047"))
                      setOnClickListener { HourlyReceiver.play(this@MainActivity, 1) }
                  }
                  root.addView(title); root.addView(statusText); root.addView(btnToggle)
                  root.addView(chkHalf); root.addView(chkQuiet); root.addView(soundLabel); root.addView(spSound)
                  root.addView(intervalLabel); root.addView(spInterval); root.addView(btnFile); root.addView(btnTest); root.addView(btnTestHalf)
                  scroll.addView(root); setContentView(scroll)
              }
              override fun onActivityResult(req: Int, res: Int, data: Intent?) {
                  super.onActivityResult(req, res, data)
                  if (req == REQ_AUDIO && res == Activity.RESULT_OK) {
                      data?.data?.let { uri ->
                          try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                          getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE).edit().putString("uri", uri.toString()).putInt("snd_type", 3).apply()
                          Toast.makeText(this, "فایل صوتی تنظیم شد", Toast.LENGTH_SHORT).show()
                      }
                  }
              }
          }

          class HourlyReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val cal = Calendar.getInstance()
                  val hour = cal.get(Calendar.HOUR_OF_DAY)
                  val min = cal.get(Calendar.MINUTE)
                  val prefs = context.getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                  if (!(prefs.getBoolean("quiet", true) && (hour >= 23 || hour < 7))) {
                      if (min in 25..35) {
                          if (prefs.getBoolean("half_hour", true)) play(context, 1)
                      } else {
                          val h = hour % 12
                          play(context, if (h == 0) 12 else h)
                      }
                  }
                  schedule(context)
              }
              companion object {
                  fun play(context: Context, rounds: Int) {
                      val prefs = context.getSharedPreferences("ChimePrefs", Context.MODE_PRIVATE)
                      val type = prefs.getInt("snd_type", 0)
                      val uriStr = prefs.getString("uri", null)
                      val gap = prefs.getLong("interval", 1000L)
                      thread {
                          for (i in 0 until rounds) {
                              if (type == 3 && uriStr != null) {
                                  try {
                                      val mp = MediaPlayer.create(context, Uri.parse(uriStr))
                                      mp?.start()
                                      val dur = mp?.duration?.toLong() ?: 1000L
                                      Thread.sleep(dur + gap)
                                      mp?.release()
                                  } catch (_: Exception) { playTone(587.33, gap) }
                              } else {
                                  playTone(if (type == 1) 440.0 else if (type == 2) 880.0 else 587.33, gap)
                              }
                          }
                      }
                  }
                  private fun playTone(freq: Double, gap: Long) {
                      val sr = 44100; val dur = 0.8; val n = (dur * sr).toInt(); val buf = ShortArray(n)
                      for (i in 0 until n) {
                          val t = i.toDouble() / sr
                          buf[i] = (sin(2 * Math.PI * freq * t) * Math.exp(-3.5 * t) * 32767).toInt().toShort()
                      }
                      val trk = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(n * 2).setTransferMode(AudioTrack.MODE_STATIC).build()
                      trk.write(buf, 0, n); trk.play()
                      Thread.sleep((dur * 1000).toLong() + gap); trk.release()
                  }
                  fun schedule(context: Context) {
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val pi = PendingIntent.getBroadcast(context, 101, Intent(context, HourlyReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val now = Calendar.getInstance()
                      val next = Calendar.getInstance().apply {
                          set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                          if (now.get(Calendar.MINUTE) < 30) set(Calendar.MINUTE, 30) else { add(Calendar.HOUR_OF_DAY, 1); set(Calendar.MINUTE, 0) }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                      else am.setExact(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                  }
                  fun cancel(context: Context) {
                      val am = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
          
