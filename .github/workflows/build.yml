name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Build Project
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime app/src/main/res/drawable app/src/main/res/raw
          cp icon.png app/src/main/res/drawable/ic_launcher_haram.png 2>/dev/null || true
          cp saat.mp3 app/src/main/res/raw/saat.mp3 2>/dev/null || true
          cp salavat.mp3 app/src/main/res/raw/salavat.mp3 2>/dev/null || true

          cat << 'EOF' > settings.gradle
          rootProject.name = "HourlyChimeApp"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hourlychime'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.hourlychime"
                  minSdk 23
                  targetSdk 34
                  versionCode 26
                  versionName "4.2"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_blurred_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="360dp" android:height="640dp" android:viewportWidth="360" android:viewportHeight="640">
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#040D1A" />
              <path android:pathData="M180,260m-130,0a130,130 0,1,1 260,0a130,130 0,1,1 -260,0" android:fillColor="#0B1E38" />
              <path android:pathData="M110,220 C110,90 145,70 180,70 C215,70 250,90 250,220 Z" android:fillColor="#102C4E" />
              <path android:pathData="M120,220 L240,220 L225,500 L135,500 Z" android:fillColor="#091A30" />
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#BD051020" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application android:allowBackup="true" android:icon="@drawable/ic_launcher_haram" android:roundIcon="@drawable/ic_launcher_haram" android:label="ساعت حرم" android:supportsRtl="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".HourlyReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/hourlychime/MainActivity.kt
          package com.example.hourlychime
          import android.app.*
          import android.content.*
          import android.content.res.ColorStateList
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.*
          import android.widget.*
          import java.util.Calendar
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private var btnTestRef: Button? = null
              private var btnStopAllRef: Button? = null

              private fun card(c: String): LinearLayout = LinearLayout(this).apply {
                  orientation = 1; setPadding(35, 30, 35, 30)
                  background = GradientDrawable().apply { setColor(Color.parseColor("#800A192F")); cornerRadius = 32f; setStroke(2, Color.parseColor(c)) }
                  layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 26) }
              }

              private fun sw(t: String, init: Boolean, hex: String): Switch {
                  val ac = Color.parseColor(hex)
                  return Switch(this).apply {
                      text = t; textSize = 15f; setTextColor(Color.WHITE); isChecked = init; setPadding(0, 14, 0, 14)
                      thumbTintList = ColorStateList(arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()), intArrayOf(ac, Color.parseColor("#94A3B8")))
                      trackTintList = ColorStateList(arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()), intArrayOf(Color.argb(120, Color.red(ac), Color.green(ac), Color.blue(ac)), Color.parseColor("#334155")))
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("P", 0)
                  val sv = ScrollView(this).apply { setBackgroundResource(R.drawable.bg_blurred_haram); isFillViewport = true }
                  val ml = LinearLayout(this).apply { orientation = 1; setPadding(35, 45, 35, 45) }

                  ml.addView(TextView(this).apply { text = "ساعت حرم امام رضا (ع)"; textSize = 23f; setTextColor(Color.parseColor("#F59E0B")); typeface = Typeface.DEFAULT_BOLD; gravity = 1 })
                  ml.addView(TextView(this).apply { text = "السلام علیک یا علی بن موسی الرضا"; textSize = 13f; setTextColor(Color.parseColor("#7DD3FC")); gravity = 1; setPadding(0, 6, 0, 28) })

                  val c1 = card("#F59E0B")
                  val st = TextView(this).apply {
                      val on = p.getBoolean("on", false)
                      text = if (on) "● وضعیت برنامه: فعال" else "○ وضعیت برنامه: غیرفعال"
                      textSize = 14f; setTextColor(if (on) Color.parseColor("#34D399") else Color.parseColor("#94A3B8")); typeface = Typeface.DEFAULT_BOLD; setPadding(0, 0, 0, 15)
                  }
                  val btnToggle = Button(this).apply {
                      val on = p.getBoolean("on", false)
                      text = if (on) "خاموش کردن سرویس زنگ" else "روشن کردن سامانه ساعت حرم"
                      background = GradientDrawable().apply { setColor(if (on) Color.parseColor("#DC2626") else Color.parseColor("#0284C7")); cornerRadius = 24f }
                      setTextColor(Color.WHITE); textSize = 15f
                      setOnClickListener {
                          val n = !p.getBoolean("on", false); p.edit().putBoolean("on", n).apply()
                          if (n) { HourlyReceiver.sch(this@MainActivity); text = "خاموش کردن سرویس زنگ"; (background as GradientDrawable).setColor(Color.parseColor("#DC2626")); st.text = "● وضعیت برنامه: فعال"; st.setTextColor(Color.parseColor("#34D399")) }
                          else { HourlyReceiver.can(this@MainActivity); text = "روشن کردن سامانه ساعت حرم"; (background as GradientDrawable).setColor(Color.parseColor("#0284C7")); st.text = "○ وضعیت برنامه: غیرفعال"; st.setTextColor(Color.parseColor("#94A3B8")) }
                      }
                  }
                  c1.addView(st); c1.addView(btnToggle); ml.addView(c1)

                  val c2 = card("#10B981")
                  c2.addView(TextView(this).apply { text = "🕊️ نوای ساعت امام هشتم (ع)"; textSize = 16f; setTextColor(Color.parseColor("#34D399")); typeface = Typeface.DEFAULT_BOLD })
                  val swSalawat = sw("پخش در ساعت ۸ و ۲۰ (تک‌زنگ + صلوات)", p.getBoolean("salawat_8", true), "#34D399").apply { setOnCheckedChangeListener { _, c -> p.edit().putBoolean("salawat_8", c).apply() } }
                  c2.addView(swSalawat); ml.addView(c2)

                  val c3 = card("#0284C7")
                  c3.addView(TextView(this).apply { text = "⏱️ زمان‌بندی و تنظیمات زنگ"; textSize = 16f; setTextColor(Color.parseColor("#38BDF8")); typeface = Typeface.DEFAULT_BOLD })
                  val swHour = sw("زنگ‌های سر هر ساعت فعال باشد", p.getBoolean("hour_enable", true), "#38BDF8").apply { setOnCheckedChangeListener { _, c -> p.edit().putBoolean("hour_enable", c).apply() } }
                  val spMode = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("به تعداد ساعت (مثلاً ساعت ۵، ۵ ضربه)", "فقط یک تک‌زنگ سر ساعت"))
                      setSelection(if (p.getBoolean("single_hourly_chime", false)) 1 else 0)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: View?, pos: Int, id: Long) { p.edit().putBoolean("single_hourly_chime", pos == 1).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }
                  val swHalf = sw("تک‌زنگ در دقیقه ۳۰ (نیم‌ساعت)", p.getBoolean("half", true), "#FDE047").apply { setOnCheckedChangeListener { _, c -> p.edit().putBoolean("half", c).apply() } }
                  val swQuiet = sw("بی‌صدا در شب (۲۳:۰۰ الی ۰۷:۰۰)", p.getBoolean("q", true), "#A78BFA").apply { setOnCheckedChangeListener { _, c -> p.edit().putBoolean("q", c).apply() } }
                  val swCall = sw("قطع پخش صدا در هنگام مکالمه تلفنی", p.getBoolean("mute_in_call", true), "#FB7185").apply { setOnCheckedChangeListener { _, c -> p.edit().putBoolean("mute_in_call", c).apply() } }

                  val vals = longArrayOf(0L, 500L, 1000L, 1500L, 2000L)
                  val spGap = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("فاصله ضربات: ۰ ثانیه", "فاصله: ۰.۵ ثانیه", "فاصله: ۱ ثانیه", "فاصله: ۱.۵ ثانیه", "فاصله: ۲ ثانیه"))
                      var idx = 2; val cur = p.getLong("gap", 1000L)
                      for (i in vals.indices) if (vals[i] == cur) idx = i
                      setSelection(idx)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: View?, pos: Int, id: Long) { p.edit().putLong("gap", vals[pos]).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }
                  c3.addView(swHour); c3.addView(spMode); c3.addView(swHalf); c3.addView(swQuiet); c3.addView(swCall); c3.addView(spGap); ml.addView(c3)

                  val c4 = card("#334155")
                  c4.addView(TextView(this).apply { text = "🎵 فایل‌های صوتی فعال"; textSize = 16f; setTextColor(Color.parseColor("#E2E8F0")); typeface = Typeface.DEFAULT_BOLD; setPadding(0, 0, 0, 10) })
                  val btnFH = Button(this).apply {
                      val has = p.getString("uri_hour", null) != null
                      text = if (has) "صدای ساعت: فایل شخصی (بازگشت به saat)" else "صدای ساعت: فایل saat پیش‌فرض داخلی"
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 20f; setStroke(1, Color.parseColor("#38BDF8")) }
                      setTextColor(Color.parseColor("#38BDF8")); textSize = 13f
                      setOnClickListener { if (has) { p.edit().remove("uri_hour").apply(); recreate() } else startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, 101) }
                  }
                  val btnFS = Button(this).apply {
                      val has = p.getString("uri_salawat", null) != null
                      text = if (has) "صلوات ۸ و ۲۰: فایل شخصی (بازگشت به salavat)" else "صلوات ۸ و ۲۰: نوای salavat پیش‌فرض داخلی"
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 20f; setStroke(1, Color.parseColor("#34D399")) }
                      setTextColor(Color.parseColor("#34D399")); textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 14, 0, 0) }
                      setOnClickListener { if (has) { p.edit().remove("uri_salawat").apply(); recreate() } else startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, 102) }
                  }
                  c4.addView(btnFH); c4.addView(btnFS); ml.addView(c4)

                  val btnStop = Button(this).apply {
                      btnStopAllRef = this; text = "⛔ توقف کامل پخش صدا"; setTextColor(Color.WHITE); visibility = View.GONE
                      background = GradientDrawable().apply { setColor(Color.parseColor("#B91C1C")); cornerRadius = 24f }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 14) }
                      setOnClickListener { HourlyReceiver.stop(); resetBtns() }
                  }
                  ml.addView(btnStop)

                  val btnT = Button(this).apply {
                      btnTestRef = this; text = "تست صدای ساعت جاری"; setTextColor(Color.WHITE)
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 22f; setStroke(2, Color.parseColor("#64748B")) }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 12) }
                      setOnClickListener {
                          if (HourlyReceiver.isPlaying) { HourlyReceiver.stop(); resetBtns() }
                          else {
                              val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) % 12
                              val cnt = if (p.getBoolean("single_hourly_chime", false)) 1 else (if (h == 0) 12 else h)
                              text = "توقف تست ساعت"; (background as GradientDrawable).setColor(Color.parseColor("#DC2626")); btnStopAllRef?.visibility = View.VISIBLE
                              HourlyReceiver.play(this@MainActivity, cnt) { runOnUiThread { resetBtns() } }
                          }
                      }
                  }
                  val btnTH = Button(this).apply {
                      text = "تست تک‌زنگ نیم‌ساعت"; setTextColor(Color.parseColor("#FDE047"))
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 22f; setStroke(2, Color.parseColor("#CA8A04")) }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { setMargins(0, 0, 0, 12) }
                      setOnClickListener { if (HourlyReceiver.isPlaying) { HourlyReceiver.stop(); resetBtns() } else { btnStopAllRef?.visibility = View.VISIBLE; HourlyReceiver.play(this@MainActivity, 1) { runOnUiThread { resetBtns() } } } }
                  }
                  val btnTS = Button(this).apply {
                      text = "تست نوای ساعت ۸ و ۲۰ (تک‌زنگ + صلوات)"; setTextColor(Color.parseColor("#34D399"))
                      background = GradientDrawable().apply { setColor(Color.parseColor("#064E3B")); cornerRadius = 22f; setStroke(2, Color.parseColor("#059669")) }
                      setOnClickListener { if (HourlyReceiver.isPlaying) { HourlyReceiver.stop(); resetBtns() } else { btnStopAllRef?.visibility = View.VISIBLE; HourlyReceiver.playSalawat(this@MainActivity) { runOnUiThread { resetBtns() } } } }
                  }
                  ml.addView(btnT); ml.addView(btnTH); ml.addView(btnTS)
                  sv.addView(ml); setContentView(sv)
              }

              private fun resetBtns() {
                  btnTestRef?.text = "تست صدای ساعت جاری"
                  (btnTestRef?.background as? GradientDrawable)?.setColor(Color.parseColor("#1E293B"))
                  btnStopAllRef?.visibility = View.GONE
              }

              override fun onPause() { super.onPause(); HourlyReceiver.stop(); resetBtns() }

              override fun onActivityResult(req: Int, res: Int, d: Intent?) {
                  super.onActivityResult(req, res, d)
                  if (res == RESULT_OK && d?.data != null) {
                      val u = d.data!!
                      try { contentResolver.takePersistableUriPermission(u, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                      getSharedPreferences("P", 0).edit().putString(if (req == 101) "uri_hour" else "uri_salawat", u.toString()).apply()
                      recreate()
                  }
              }
          }

          class HourlyReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val wl = (c.getSystemService(Context.POWER_SERVICE) as PowerManager).newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Haram:Lock")
                  wl.acquire(60000L)
                  try {
                      if (!muteCall(c)) {
                          val cal = Calendar.getInstance(); val h = cal.get(Calendar.HOUR_OF_DAY); val m = cal.get(Calendar.MINUTE); val p = c.getSharedPreferences("P", 0)
                          if (m in 0..4 && (h == 8 || h == 20) && p.getBoolean("salawat_8", true)) playSalawat(c) {}
                          else if (!(p.getBoolean("q", true) && (h >= 23 || h < 7))) {
                              if (m in 25..35) { if (p.getBoolean("half", true)) play(c, 1) {} }
                              else if (p.getBoolean("hour_enable", true)) {
                                  val c12 = h % 12
                                  play(c, if (p.getBoolean("single_hourly_chime", false)) 1 else (if (c12 == 0) 12 else c12)) {}
                              }
                          }
                      }
                  } finally { sch(c); if (wl.isHeld) wl.release() }
              }

              companion object {
                  @Volatile var isPlaying = false
                  private var mp: MediaPlayer? = null

                  private fun muteCall(c: Context): Boolean {
                      if (!c.getSharedPreferences("P", 0).getBoolean("mute_in_call", true)) return false
                      val am = c.getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return false
                      return am.mode == AudioManager.MODE_IN_CALL || am.mode == AudioManager.MODE_IN_COMMUNICATION || am.mode == AudioManager.MODE_RINGTONE
                  }

                  fun stop() {
                      isPlaying = false
                      try { mp?.let { if (it.isPlaying) it.stop(); it.reset(); it.release() } } catch (_: Exception) {}
                      mp = null
                  }

                  fun playSalawat(c: Context, onFinish: (() -> Unit)? = null) {
                      stop(); if (muteCall(c)) { onFinish?.invoke(); return }; isPlaying = true
                      val p = c.getSharedPreferences("P", 0); val uH = p.getString("uri_hour", null); val uS = p.getString("uri_salawat", null)
                      thread {
                          try {
                              val cp = if (uH != null) MediaPlayer.create(c, Uri.parse(uH)) else MediaPlayer.create(c, R.raw.saat)
                              if (cp != null) { mp = cp; cp.start(); var w = 0L; while (w < cp.duration + 800L && isPlaying && !muteCall(c)) { Thread.sleep(100); w += 100 }; cp.release(); mp = null }
                              if (isPlaying && !muteCall(c)) {
                                  val sp = if (uS != null) MediaPlayer.create(c, Uri.parse(uS)) else MediaPlayer.create(c, R.raw.salavat)
                                  if (sp != null) { mp = sp; sp.start(); while (sp.isPlaying && isPlaying && !muteCall(c)) Thread.sleep(150); sp.release(); mp = null }
                              }
                          } catch (_: Exception) {} finally { isPlaying = false; onFinish?.invoke() }
                      }
                  }

                  fun play(c: Context, r: Int, onFinish: (() -> Unit)? = null) {
                      stop(); if (muteCall(c)) { onFinish?.invoke(); return }; isPlaying = true
                      val p = c.getSharedPreferences("P", 0); val u = p.getString("uri_hour", null); val g = p.getLong("gap", 1000L)
                      thread {
                          try {
                              for (idx in 0 until r) {
                                  if (!isPlaying || muteCall(c)) break
                                  val pl = if (u != null) MediaPlayer.create(c, Uri.parse(u)) else MediaPlayer.create(c, R.raw.saat)
                                  if (pl != null) { mp = pl; pl.start(); var w = 0L; while (w < pl.duration + g && isPlaying && !muteCall(c)) { Thread.sleep(100); w += 100 }; pl.release(); mp = null }
                                  else Thread.sleep(1000)
                              }
                          } catch (_: Exception) {} finally { isPlaying = false; onFinish?.invoke() }
                      }
                  }

                  fun sch(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val pi = PendingIntent.getBroadcast(c, 101, Intent(c, HourlyReceiver::class.java).apply { flags = Intent.FLAG_RECEIVER_FOREGROUND }, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val now = Calendar.getInstance(); val next = Calendar.getInstance().apply { set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0); if (now.get(Calendar.MINUTE) < 30) set(Calendar.MINUTE, 30) else { add(Calendar.HOUR_OF_DAY, 1); set(Calendar.MINUTE, 0) } }
                      if (Build.VERSION.SDK_INT >= 21) am.setAlarmClock(AlarmManager.AlarmClockInfo(next.timeInMillis, PendingIntent.getActivity(c, 102, Intent(c, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)), pi)
                      else am.setExact(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                  }

                  fun can(c: Context) { (c.getSystemService(Context.ALARM_SERVICE) as AlarmManager).cancel(PendingIntent.getBroadcast(c, 101, Intent(c, HourlyReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)) }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) { if (i.action == Intent.ACTION_BOOT_COMPLETED && c.getSharedPreferences("P", 0).getBoolean("on", false)) HourlyReceiver.sch(c) }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaramClock-v4.2-CustomIcon-APK
          path: app/build/outputs/apk/debug/*.apk
