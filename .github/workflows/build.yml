name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Prepare Audio and Project
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw

          cp saat.mp3 app/src/main/res/raw/saat.mp3 2>/dev/null || true
          cp salavat.mp3 app/src/main/res/raw/salavat.mp3 2>/dev/null || true

          echo 'rootProject.name = "HourlyChimeApp"' > settings.gradle
          echo 'include ":app"' >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hourlychime'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.hourlychime"
                  minSdk 23
                  targetSdk 34
                  versionCode 25
                  versionName "4.1"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z" android:fillColor="#FFFFFF" />
              <path android:pathData="M54,2 L54,16" android:strokeColor="#64748B" android:strokeWidth="1.8" />
              <path android:pathData="M54,4m-2,0a2,2 0,1,1 4,0a2,2 0,1,1 -4,0" android:fillColor="#475569" />
              <path android:pathData="M32,38 C32,18 42,14 54,14 C66,14 76,18 76,38 Z" android:fillColor="#0284C7" />
              <path android:pathData="M38,34 C46,20 62,20 70,34 M44,20 C50,30 58,30 64,20" android:strokeColor="#FFFFFF" android:strokeWidth="1.4" />
              <path android:pathData="M31,38 L77,38 L75,41 L33,41 Z" android:fillColor="#D97706" />
              <path android:pathData="M33,41 L75,41 L73,56 L35,56 Z" android:fillColor="#1E3A8A" />
              <path android:pathData="M27,47 L33,45 L33,52 Z" android:fillColor="#64748B" />
              <path android:pathData="M81,47 L75,45 L75,52 Z" android:fillColor="#64748B" />
              <path android:pathData="M25,56 L83,56 L81,60 L27,60 Z" android:fillColor="#F1F5F9" />
              <path android:pathData="M35,60 L73,60 L69,89 L39,89 Z" android:fillColor="#1D4ED8" />
              <path android:pathData="M38,69 L42,69 L42,82 L38,82 Z" android:fillColor="#BAE6FD" />
              <path android:pathData="M66,69 L70,69 L70,82 L66,82 Z" android:fillColor="#BAE6FD" />
              <path android:pathData="M54,76m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0" android:fillColor="#FFFFFF" />
              <path android:pathData="M54,76m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0" android:strokeColor="#F59E0B" android:strokeWidth="2.2" />
              <path android:pathData="M54,76 L54,68" android:strokeColor="#0F172A" android:strokeWidth="2.2" android:strokeLineCap="round" />
              <path android:pathData="M54,76 L62,76" android:strokeColor="#0F172A" android:strokeWidth="2" android:strokeLineCap="round" />
              <path android:pathData="M23,89 L85,89 L79,100 L29,100 Z" android:fillColor="#0284C7" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_blurred_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="360dp" android:height="640dp"
              android:viewportWidth="360" android:viewportHeight="640">
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#040D1A" />
              <path android:pathData="M180,260m-130,0a130,130 0,1,1 260,0a130,130 0,1,1 -260,0" android:fillColor="#0B1E38" />
              <path android:pathData="M110,220 C110,90 145,70 180,70 C215,70 250,90 250,220 Z" android:fillColor="#102C4E" />
              <path android:pathData="M120,220 L240,220 L225,500 L135,500 Z" android:fillColor="#091A30" />
              <path android:pathData="M180,360m-45,0a45,45 0,1,1 90,0a45,45 0,1,1 -90,0" android:fillColor="#1C271E" />
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#BD051020" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_haram"
                  android:label="ساعت حرم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".HourlyReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/hourlychime/MainActivity.kt
          package com.example.hourlychime
          import android.app.*
          import android.content.*
          import android.content.res.ColorStateList
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import java.util.Calendar
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private val REQ_HOUR = 101
              private val REQ_SALAWAT = 102
              private var btnTestRef: Button? = null
              private var btnStopAllRef: Button? = null

              private fun createCard(borderColor: Int = Color.parseColor("#1E3A5F")): LinearLayout {
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(35, 30, 35, 30)
                      val gd = GradientDrawable().apply {
                          setColor(Color.parseColor("#800A192F")) // شیشه‌ای مات تیره
                          cornerRadius = 32f
                          setStroke(2, borderColor)
                      }
                      background = gd
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, 28)
                      layoutParams = lp
                  }
              }

              private fun makeSwitch(title: String, initial: Boolean, activeColorHex: String): Switch {
                  val activeColor = Color.parseColor(activeColorHex)
                  val inactiveColor = Color.parseColor("#64748B")
                  val thumbStates = ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                      intArrayOf(activeColor, Color.parseColor("#94A3B8"))
                  )
                  val trackStates = ColorStateList(
                      arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf()),
                      intArrayOf(Color.parseColor(activeColorHex).let { Color.argb(120, Color.red(it), Color.green(it), Color.blue(it)) }, Color.parseColor("#334155"))
                  )

                  return Switch(this).apply {
                      text = title
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      isChecked = initial
                      thumbTintList = thumbStates
                      trackTintList = trackStates
                      setPadding(0, 15, 0, 15)
                  }
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("P", 0)

                  val sv = ScrollView(this).apply {
                      setBackgroundResource(resources.getIdentifier("bg_blurred_haram", "drawable", packageName))
                      isFillViewport = true
                  }

                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(35, 45, 35, 45)
                  }

                  // هدر بالا
                  val headerBox = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 30)
                  }
                  val title = TextView(this).apply {
                      text = "ساعت حرم امام رضا (ع)"
                      textSize = 23f
                      setTextColor(Color.parseColor("#F59E0B"))
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  val subTitle = TextView(this).apply {
                      text = "السلام علیک یا علی بن موسی الرضا"
                      textSize = 13f
                      setTextColor(Color.parseColor("#7DD3FC"))
                      gravity = Gravity.CENTER
                      setPadding(0, 6, 0, 0)
                  }
                  headerBox.addView(title); headerBox.addView(subTitle)
                  mainLayout.addView(headerBox)

                  // کارت ۱: وضعیت کلی سامانه
                  val card1 = createCard(Color.parseColor("#F59E0B"))
                  val st = TextView(this).apply {
                      val on = p.getBoolean("on", false)
                      text = if (on) "● وضعیت برنامه: فعال و در حال خدمت" else "○ وضعیت برنامه: غیرفعال"
                      textSize = 14f
                      setTextColor(if (on) Color.parseColor("#34D399") else Color.parseColor("#94A3B8"))
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 15)
                  }
                  val btnToggle = Button(this).apply {
                      val on = p.getBoolean("on", false)
                      text = if (on) "خاموش کردن سرویس زنگ" else "روشن کردن سامانه ساعت حرم"
                      val bg = GradientDrawable().apply {
                          setColor(if (on) Color.parseColor("#DC2626") else Color.parseColor("#0284C7"))
                          cornerRadius = 24f
                      }
                      background = bg
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      setOnClickListener {
                          val n = !p.getBoolean("on", false)
                          p.edit().putBoolean("on", n).apply()
                          if (n) {
                              HourlyReceiver.sch(this@MainActivity)
                              text = "خاموش کردن سرویس زنگ"
                              (background as GradientDrawable).setColor(Color.parseColor("#DC2626"))
                              st.text = "● وضعیت برنامه: فعال و در حال خدمت"
                              st.setTextColor(Color.parseColor("#34D399"))
                          } else {
                              HourlyReceiver.can(this@MainActivity)
                              text = "روشن کردن سامانه ساعت حرم"
                              (background as GradientDrawable).setColor(Color.parseColor("#0284C7"))
                              st.text = "○ وضعیت برنامه: غیرفعال"
                              st.setTextColor(Color.parseColor("#94A3B8"))
                          }
                      }
                  }
                  card1.addView(st); card1.addView(btnToggle)
                  mainLayout.addView(card1)

                  // کارت ۲: ساعت امام رضا (ع) - ۰۸:۰۰ و ۲۰:۰۰
                  val card2 = createCard(Color.parseColor("#10B981"))
                  val labelCard2 = TextView(this).apply {
                      text = "🕊️ نوای ساعت امام هشتم (ع)"
                      textSize = 16f
                      setTextColor(Color.parseColor("#34D399"))
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 10)
                  }
                  val swSalawat = makeSwitch("پخش در ساعت ۸ و ۲۰ (تک‌زنگ + صلوات خاصه)", p.getBoolean("salawat_8", true), "#34D399")
                  swSalawat.setOnCheckedChangeListener { _, c -> p.edit().putBoolean("salawat_8", c).apply() }
                  card2.addView(labelCard2); card2.addView(swSalawat)
                  mainLayout.addView(card2)

                  // کارت ۳: زمان‌بندی زنگ‌های ساعت
                  val card3 = createCard(Color.parseColor("#0284C7"))
                  val labelCard3 = TextView(this).apply {
                      text = "⏱️ زمان‌بندی و نواختن زنگ‌ها"
                      textSize = 16f
                      setTextColor(Color.parseColor("#38BDF8"))
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 10)
                  }

                  val swHourEnable = makeSwitch("زنگ‌های سر هر ساعت فعال باشد", p.getBoolean("hour_enable", true), "#38BDF8")
                  swHourEnable.setOnCheckedChangeListener { _, c -> p.edit().putBoolean("hour_enable", c).apply() }

                  val modeLabel = TextView(this).apply {
                      text = "نحوه زنگ زدن سر هر ساعت:"; setTextColor(Color.parseColor("#BAE6FD")); setPadding(0, 12, 0, 6); textSize = 13f
                  }
                  val spHourMode = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("به تعداد ساعت (مثلاً ساعت ۵، ۵ ضربه)", "فقط یک تک‌زنگ سر ساعت"))
                      setSelection(if (p.getBoolean("single_hourly_chime", false)) 1 else 0)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                              p.edit().putBoolean("single_hourly_chime", pos == 1).apply()
                          }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }

                  val swHalf = makeSwitch("تک‌زنگ در دقیقه ۳۰ (نیم‌ساعت)", p.getBoolean("half", true), "#FDE047")
                  swHalf.setOnCheckedChangeListener { _, c -> p.edit().putBoolean("half", c).apply() }

                  val swQuiet = makeSwitch("حالت بی‌صدا در شب (۲۳:۰۰ الی ۰۷:۰۰)", p.getBoolean("q", true), "#A78BFA")
                  swQuiet.setOnCheckedChangeListener { _, c -> p.edit().putBoolean("q", c).apply() }

                  val gapLabel = TextView(this).apply {
                      text = "فاصله بین ضربات زنگ:"; setTextColor(Color.parseColor("#BAE6FD")); setPadding(0, 12, 0, 6); textSize = 13f
                  }
                  val vals = longArrayOf(0L, 500L, 1000L, 1500L, 2000L)
                  val spGap = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("بدون فاصله (۰ ثانیه)", "فاصله ۰.۵ ثانیه", "فاصله ۱ ثانیه", "فاصله ۱.۵ ثانیه", "فاصله ۲ ثانیه"))
                      var idx = 2; val cur = p.getLong("gap", 1000L)
                      for (i in vals.indices) if (vals[i] == cur) idx = i
                      setSelection(idx)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: View?, pos: Int, id: Long) { p.edit().putLong("gap", vals[pos]).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }

                  card3.addView(labelCard3); card3.addView(swHourEnable)
                  card3.addView(modeLabel); card3.addView(spHourMode)
                  card3.addView(swHalf); card3.addView(swQuiet)
                  card3.addView(gapLabel); card3.addView(spGap)
                  mainLayout.addView(card3)

                  // کارت ۴: مدیریت فایل‌های صوتی
                  val card4 = createCard(Color.parseColor("#334155"))
                  val labelCard4 = TextView(this).apply {
                      text = "🎵 فایل‌های صوتی فعال"
                      textSize = 16f
                      setTextColor(Color.parseColor("#E2E8F0"))
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(0, 0, 0, 10)
                  }

                  val btnFileHour = Button(this).apply {
                      val hasCustom = p.getString("uri_hour", null) != null
                      text = if (hasCustom) "صدای ساعت: فایل شخصی گوشی (کلیک برای بازگشت)" else "صدای ساعت: فایل saat پیش‌فرض داخلی"
                      val gd = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 20f; setStroke(1, Color.parseColor("#38BDF8")) }
                      background = gd
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 13f
                      setOnClickListener {
                          if (hasCustom) {
                              p.edit().remove("uri_hour").apply()
                              Toast.makeText(this@MainActivity, "صدای پیش‌فرض saat فعال شد", Toast.LENGTH_SHORT).show()
                              recreate()
                          } else {
                              startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ_HOUR)
                          }
                      }
                  }

                  val btnFileSalawat = Button(this).apply {
                      val hasCustom = p.getString("uri_salawat", null) != null
                      text = if (hasCustom) "صلوات ۸ و ۲۰: فایل شخصی گوشی (کلیک برای بازگشت)" else "صلوات ۸ و ۲۰: نوای salavat پیش‌فرض داخلی"
                      val gd = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 20f; setStroke(1, Color.parseColor("#34D399")) }
                      background = gd
                      setTextColor(Color.parseColor("#34D399"))
                      textSize = 13f
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 14, 0, 0)
                      layoutParams = lp
                      setOnClickListener {
                          if (hasCustom) {
                              p.edit().remove("uri_salawat").apply()
                              Toast.makeText(this@MainActivity, "صلوات پیش‌فرض فعال شد", Toast.LENGTH_SHORT).show()
                              recreate()
                          } else {
                              startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ_SALAWAT)
                          }
                      }
                  }
                  card4.addView(labelCard4); card4.addView(btnFileHour); card4.addView(btnFileSalawat)
                  mainLayout.addView(card4)

                  // دکمه سراسری توقف کامل
                  val btnStopAll = Button(this).apply {
                      btnStopAllRef = this
                      text = "⛔ توقف کامل پخش صدا"
                      val gd = GradientDrawable().apply { setColor(Color.parseColor("#B91C1C")); cornerRadius = 24f }
                      background = gd
                      setTextColor(Color.WHITE)
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      visibility = View.GONE
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, 16)
                      layoutParams = lp
                      setOnClickListener {
                          HourlyReceiver.stop()
                          resetTestButtons()
                      }
                  }
                  mainLayout.addView(btnStopAll)

                  // دکمه‌های تست
                  val btnT = Button(this).apply {
                      btnTestRef = this
                      text = "تست صدای ساعت جاری"
                      val gd = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 22f; setStroke(2, Color.parseColor("#64748B")) }
                      background = gd
                      setTextColor(Color.WHITE)
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, 12)
                      layoutParams = lp
                      setOnClickListener {
                          if (HourlyReceiver.isPlaying) {
                              HourlyReceiver.stop()
                              resetTestButtons()
                          } else {
                              HourlyReceiver.stop()
                              val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) % 12
                              val count = if (p.getBoolean("single_hourly_chime", false)) 1 else (if (h == 0) 12 else h)
                              text = "توقف تست ساعت جاری"
                              (background as GradientDrawable).setColor(Color.parseColor("#DC2626"))
                              btnStopAllRef?.visibility = View.VISIBLE
                              HourlyReceiver.play(this@MainActivity, count) {
                                  runOnUiThread { resetTestButtons() }
                              }
                          }
                      }
                  }

                  val btnTH = Button(this).apply {
                      text = "تست تک‌زنگ نیم‌ساعت"
                      val gd = GradientDrawable().apply { setColor(Color.parseColor("#1E293B")); cornerRadius = 22f; setStroke(2, Color.parseColor("#CA8A04")) }
                      background = gd
                      setTextColor(Color.parseColor("#FDE047"))
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, 12)
                      layoutParams = lp
                      setOnClickListener {
                          if (HourlyReceiver.isPlaying) {
                              HourlyReceiver.stop()
                              resetTestButtons()
                          } else {
                              HourlyReceiver.stop()
                              btnStopAllRef?.visibility = View.VISIBLE
                              HourlyReceiver.play(this@MainActivity, 1) {
                                  runOnUiThread { resetTestButtons() }
                              }
                          }
                      }
                  }

                  val btnTSalawat = Button(this).apply {
                      text = "تست نوای ساعت ۸ و ۲۰ (تک‌زنگ + صلوات)"
                      val gd = GradientDrawable().apply { setColor(Color.parseColor("#064E3B")); cornerRadius = 22f; setStroke(2, Color.parseColor("#059669")) }
                      background = gd
                      setTextColor(Color.parseColor("#34D399"))
                      val lp = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT)
                      lp.setMargins(0, 0, 0, 20)
                      layoutParams = lp
                      setOnClickListener {
                          if (HourlyReceiver.isPlaying) {
                              HourlyReceiver.stop()
                              resetTestButtons()
                          } else {
                              HourlyReceiver.stop()
                              btnStopAllRef?.visibility = View.VISIBLE
                              HourlyReceiver.playSalawatSpecial(this@MainActivity) {
                                  runOnUiThread { resetTestButtons() }
                              }
                          }
                      }
                  }

                  mainLayout.addView(btnT); mainLayout.addView(btnTH); mainLayout.addView(btnTSalawat)
                  sv.addView(mainLayout); setContentView(sv)
              }

              private fun resetTestButtons() {
                  btnTestRef?.text = "تست صدای ساعت جاری"
                  (btnTestRef?.background as? GradientDrawable)?.setColor(Color.parseColor("#1E293B"))
                  btnStopAllRef?.visibility = View.GONE
              }

              override fun onPause() {
                  super.onPause()
                  HourlyReceiver.stop()
                  resetTestButtons()
              }

              override fun onActivityResult(req: Int, res: Int, d: Intent?) {
                  super.onActivityResult(req, res, d)
                  if (res == RESULT_OK && d?.data != null) {
                      val uri = d.data!!
                      try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                      val p = getSharedPreferences("P", 0).edit()
                      when (req) {
                          REQ_HOUR -> p.putString("uri_hour", uri.toString())
                          REQ_SALAWAT -> p.putString("uri_salawat", uri.toString())
                      }
                      p.apply()
                      recreate()
                  }
              }
          }

          class HourlyReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val pm = c.getSystemService(Context.POWER_SERVICE) as PowerManager
                  val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "HaramClock:Lock")
                  wl.acquire(60000L)
                  try {
                      if (!isCall(c)) {
                          val cal = Calendar.getInstance()
                          val h = cal.get(Calendar.HOUR_OF_DAY)
                          val m = cal.get(Calendar.MINUTE)
                          val p = c.getSharedPreferences("P", 0)

                          if (m in 0..4 && (h == 8 || h == 20) && p.getBoolean("salawat_8", true)) {
                              playSalawatSpecial(c) {}
                          } else if (!(p.getBoolean("q", true) && (h >= 23 || h < 7))) {
                              if (m in 25..35) {
                                  if (p.getBoolean("half", true)) play(c, 1) {}
                              } else if (p.getBoolean("hour_enable", true)) {
                                  val isSingle = p.getBoolean("single_hourly_chime", false)
                                  val c12 = h % 12
                                  val rounds = if (isSingle) 1 else (if (c12 == 0) 12 else c12)
                                  play(c, rounds) {}
                              }
                          }
                      }
                  } finally {
                      sch(c)
                      if (wl.isHeld) wl.release()
                  }
              }

              companion object {
                  @Volatile var isPlaying = false
                  private var mp: MediaPlayer? = null

                  private fun isCall(c: Context): Boolean {
                      val am = c.getSystemService(Context.AUDIO_SERVICE) as? AudioManager ?: return false
                      return am.mode == AudioManager.MODE_IN_CALL || am.mode == AudioManager.MODE_IN_COMMUNICATION || am.mode == AudioManager.MODE_RINGTONE
                  }

                  fun stop() {
                      isPlaying = false
                      try {
                          mp?.let {
                              if (it.isPlaying) it.stop()
                              it.reset()
                              it.release()
                          }
                      } catch (_: Exception) {}
                      mp = null
                  }

                  fun playSalawatSpecial(c: Context, onFinish: (() -> Unit)? = null) {
                      stop()
                      if (isCall(c)) { onFinish?.invoke(); return }
                      isPlaying = true
                      val p = c.getSharedPreferences("P", 0)
                      val uHour = p.getString("uri_hour", null)
                      val uSalawat = p.getString("uri_salawat", null)

                      thread {
                          try {
                              val chimePlayer = if (uHour != null) {
                                  MediaPlayer.create(c, Uri.parse(uHour))
                              } else {
                                  MediaPlayer.create(c, R.raw.saat)
                              }

                              if (chimePlayer != null) {
                                  mp = chimePlayer
                                  chimePlayer.start()
                                  val chimeDur = chimePlayer.duration.toLong()
                                  var waited = 0L
                                  while (waited < chimeDur + 800L && isPlaying && !isCall(c)) {
                                      Thread.sleep(100)
                                      waited += 100
                                  }
                                  chimePlayer.release()
                                  mp = null
                              }

                              if (isPlaying && !isCall(c)) {
                                  val salawatPlayer = if (uSalawat != null) {
                                      MediaPlayer.create(c, Uri.parse(uSalawat))
                                  } else {
                                      MediaPlayer.create(c, R.raw.salavat)
                                  }

                                  if (salawatPlayer != null) {
                                      mp = salawatPlayer
                                      salawatPlayer.start()
                                      while (salawatPlayer.isPlaying && isPlaying && !isCall(c)) {
                                          Thread.sleep(150)
                                      }
                                      salawatPlayer.release()
                                      mp = null
                                  }
                              }
                          } catch (_: Exception) {}
                          finally {
                              isPlaying = false
                              onFinish?.invoke()
                          }
                      }
                  }

                  fun play(c: Context, r: Int, onFinish: (() -> Unit)? = null) {
                      stop()
                      if (isCall(c)) { isPlaying = false; onFinish?.invoke(); return }
                      isPlaying = true
                      val p = c.getSharedPreferences("P", 0)
                      val u = p.getString("uri_hour", null)
                      val g = p.getLong("gap", 1000L)

                      thread {
                          try {
                              for (idx in 0 until r) {
                                  if (!isPlaying || isCall(c)) break
                                  val player = if (u != null) {
                                      MediaPlayer.create(c, Uri.parse(u))
                                  } else {
                                      MediaPlayer.create(c, R.raw.saat)
                                  }

                                  if (player != null) {
                                      mp = player
                                      player.start()
                                      val dur = player.duration.toLong()
                                      var waited = 0L
                                      while (waited < dur + g && isPlaying && !isCall(c)) {
                                          Thread.sleep(100)
                                          waited += 100
                                      }
                                      player.release()
                                      mp = null
                                  } else {
                                      Thread.sleep(1000)
                                  }
                              }
                          } catch (_: Exception) {}
                          finally {
                              isPlaying = false
                              onFinish?.invoke()
                          }
                      }
                  }

                  fun sch(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val i = Intent(c, HourlyReceiver::class.java).apply { flags = Intent.FLAG_RECEIVER_FOREGROUND }
                      val pi = PendingIntent.getBroadcast(c, 101, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val now = Calendar.getInstance()
                      val next = Calendar.getInstance().apply {
                          set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                          if (now.get(Calendar.MINUTE) < 30) set(Calendar.MINUTE, 30)
                          else { add(Calendar.HOUR_OF_DAY, 1); set(Calendar.MINUTE, 0) }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          val showPi = PendingIntent.getActivity(c, 102, Intent(c, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                          am.setAlarmClock(AlarmManager.AlarmClockInfo(next.timeInMillis, showPi), pi)
                      } else {
                          am.setExact(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                      }
                  }

                  fun can(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      am.cancel(PendingIntent.getBroadcast(c, 101, Intent(c, HourlyReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action == Intent.ACTION_BOOT_COMPLETED && c.getSharedPreferences("P", 0).getBoolean("on", false)) {
                      HourlyReceiver.sch(c)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaramClock-v4.1-Glassmorphism-APK
          path: app/build/outputs/apk/debug/*.apk
