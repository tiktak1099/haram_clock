name: Build Native Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Create Files
        run: |
          mkdir -p app/src/main/java/com/example/hourlychime
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/raw

          # کپی فایل‌های صوتی آپلود شده از مخزن به پوشه منابع برنامه
          cp hour.mp3 app/src/main/res/raw/hour.mp3 2>/dev/null || true
          cp half.mp3 app/src/main/res/raw/half.mp3 2>/dev/null || true
          cp salawat.mp3 app/src/main/res/raw/salawat.mp3 2>/dev/null || true

          echo 'rootProject.name = "HourlyChimeApp"' > settings.gradle
          echo 'include ":app"' >> settings.gradle

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.hourlychime'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.hourlychime"
                  minSdk 23
                  targetSdk 34
                  versionCode 17
                  versionName "2.4"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions { jvmTarget = '1.8' }
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:pathData="M0,0h108v108h-108z" android:fillColor="#FFFFFF" />
              <path android:pathData="M54,2 L54,16" android:strokeColor="#64748B" android:strokeWidth="1.8" />
              <path android:pathData="M54,4m-2,0a2,2 0,1,1 4,0a2,2 0,1,1 -4,0" android:fillColor="#475569" />
              <path android:pathData="M32,38 C32,18 42,14 54,14 C66,14 76,18 76,38 Z" android:fillColor="#0284C7" />
              <path android:pathData="M38,34 C46,20 62,20 70,34 M44,20 C50,30 58,30 64,20" android:strokeColor="#FFFFFF" android:strokeWidth="1.4" />
              <path android:pathData="M31,38 L77,38 L75,41 L33,41 Z" android:fillColor="#D97706" />
              <path android:pathData="M33,41 L75,41 L73,56 L35,56 Z" android:fillColor="#1E3A8A" />
              <path android:pathData="M27,47 L33,45 L33,52 Z" android:fillColor="#64748B" />
              <path android:pathData="M81,47 L75,45 L75,52 Z" android:fillColor="#64748B" />
              <path android:pathData="M25,56 L83,56 L81,60 L27,60 Z" android:fillColor="#F1F5F9" />
              <path android:pathData="M35,60 L73,60 L69,89 L39,89 Z" android:fillColor="#1D4ED8" />
              <path android:pathData="M38,69 L42,69 L42,82 L38,82 Z" android:fillColor="#BAE6FD" />
              <path android:pathData="M66,69 L70,69 L70,82 L66,82 Z" android:fillColor="#BAE6FD" />
              <path android:pathData="M54,76m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0" android:fillColor="#FFFFFF" />
              <path android:pathData="M54,76m-12,0a12,12 0,1,1 24,0a12,12 0,1,1 -24,0" android:strokeColor="#F59E0B" android:strokeWidth="2.2" />
              <path android:pathData="M54,76 L54,68" android:strokeColor="#0F172A" android:strokeWidth="2.2" android:strokeLineCap="round" />
              <path android:pathData="M54,76 L62,76" android:strokeColor="#0F172A" android:strokeWidth="2" android:strokeLineCap="round" />
              <path android:pathData="M23,89 L85,89 L79,100 L29,100 Z" android:fillColor="#0284C7" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_blurred_haram.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="360dp" android:height="640dp"
              android:viewportWidth="360" android:viewportHeight="640">
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#081528" />
              <path android:pathData="M180,260m-130,0a130,130 0,1,1 260,0a130,130 0,1,1 -260,0" android:fillColor="#10253F" />
              <path android:pathData="M110,220 C110,90 145,70 180,70 C215,70 250,90 250,220 Z" android:fillColor="#173859" />
              <path android:pathData="M120,220 L240,220 L225,500 L135,500 Z" android:fillColor="#0E233A" />
              <path android:pathData="M180,360m-45,0a45,45 0,1,1 90,0a45,45 0,1,1 -90,0" android:fillColor="#1F2F26" />
              <path android:pathData="M0,0h360v640h-360z" android:fillColor="#B009182B" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_haram"
                  android:label="ساعت حرم"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".HourlyReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/hourlychime/MainActivity.kt
          package com.example.hourlychime
          import android.app.*
          import android.content.*
          import android.graphics.*
          import android.media.*
          import android.net.Uri
          import android.os.*
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.widget.*
          import java.util.Calendar
          import kotlin.concurrent.thread
          import kotlin.math.sin

          class MainActivity : Activity() {
              private val REQ_HOUR = 101
              private val REQ_HALF = 102
              private val REQ_SALAWAT = 103
              private var btnTestRef: Button? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val p = getSharedPreferences("P", 0)
                  val sv = ScrollView(this).apply {
                      setBackgroundResource(resources.getIdentifier("bg_blurred_haram", "drawable", packageName))
                      isFillViewport = true
                  }
                  val ll = LinearLayout(this).apply { orientation = 1; gravity = Gravity.CENTER_HORIZONTAL; setPadding(30, 40, 30, 40) }
                  val t = TextView(this).apply { text = "ساعت حرم امام رضا (ع)"; textSize = 22f; setTextColor(Color.parseColor("#38BDF8")); typeface = Typeface.DEFAULT_BOLD; gravity = 1 }
                  val st = TextView(this).apply { text = if (p.getBoolean("on", false)) "وضعیت: فعال (سر ساعت، نیم‌ساعت و ساعت ۸)" else "وضعیت: غیرفعال"; textSize = 14f; setTextColor(if (p.getBoolean("on", false)) Color.parseColor("#4ADE80") else Color.parseColor("#94A3B8")); gravity = 1; setPadding(0, 10, 0, 20) }

                  val btnToggle = Button(this).apply {
                      val on = p.getBoolean("on", false)
                      text = if (on) "خاموش کردن زنگ" else "روشن کردن زنگ ساعتی"
                      setBackgroundColor(if (on) Color.parseColor("#DC2626") else Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          val n = !p.getBoolean("on", false)
                          p.edit().putBoolean("on", n).apply()
                          if (n) {
                              HourlyReceiver.sch(this@MainActivity)
                              text = "خاموش کردن زنگ"; setBackgroundColor(Color.parseColor("#DC2626"))
                              st.text = "وضعیت: فعال (سر ساعت، نیم‌ساعت و ساعت ۸)"; st.setTextColor(Color.parseColor("#4ADE80"))
                          } else {
                              HourlyReceiver.can(this@MainActivity)
                              text = "روشن کردن زنگ ساعتی"; setBackgroundColor(Color.parseColor("#0284C7"))
                              st.text = "وضعیت: غیرفعال"; st.setTextColor(Color.parseColor("#94A3B8"))
                          }
                      }
                  }

                  val chSalawat = CheckBox(this).apply {
                      text = "پخش صلوات خاصه در ساعت ۸ و ۲۰ (جایگزین زنگ ساعت)"
                      setTextColor(Color.parseColor("#34D399"))
                      isChecked = p.getBoolean("salawat_8", true)
                      setOnCheckedChangeListener { _, c -> p.edit().putBoolean("salawat_8", c).apply() }
                  }

                  val chHalf = CheckBox(this).apply { text = "تک‌زنگ در دقیقه ۳۰ (نیم‌‌‌‌ساعت)"; setTextColor(Color.parseColor("#FDE047")); isChecked = p.getBoolean("half", true); setOnCheckedChangeListener { _, c -> p.edit().putBoolean("half", c).apply() } }
                  val cq = CheckBox(this).apply { text = "بی‌صدا در شب (۲۳:۰۰ الی ۰۷:۰۰)"; setTextColor(Color.parseColor("#E2E8F0")); isChecked = p.getBoolean("q", true); setOnCheckedChangeListener { _, c -> p.edit().putBoolean("q", c).apply() } }

                  val vals = longArrayOf(0L, 500L, 1000L, 1500L, 2000L)
                  val spGap = Spinner(this).apply {
                      adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, arrayOf("فاصله زنگ: ۰ ثانیه", "فاصله زنگ: ۰.۵ ثانیه", "فاصله زنگ: ۱ ثانیه", "فاصله زنگ: ۱.۵ ثانیه", "فاصله زنگ: ۲ ثانیه"))
                      var idx = 2; val cur = p.getLong("gap", 1000L)
                      for (i in vals.indices) if (vals[i] == cur) idx = i
                      setSelection(idx)
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(p0: AdapterView<*>?, v: android.view.View?, pos: Int, id: Long) { p.edit().putLong("gap", vals[pos]).apply() }
                          override fun onNothingSelected(p0: AdapterView<*>?) {}
                      }
                  }

                  val btnFileHour = Button(this).apply {
                      val hasFile = p.getString("uri_hour", null) != null
                      text = if (hasFile) "صدای سر ساعت: فایل دلخواه تنظیم شد (کلیک برای تغییر)" else "انتخاب فایل صوتی برای سر ساعت (پیش‌فرض: ساعت حرم)"
                      setBackgroundColor(Color.parseColor("#1E293B")); setTextColor(Color.parseColor("#38BDF8"))
                      setOnClickListener { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ_HOUR) }
                  }

                  val btnFileHalf = Button(this).apply {
                      val hasFile = p.getString("uri_half", null) != null
                      text = if (hasFile) "صدای نیم‌ساعت: فایل دلخواه تنظیم شد (کلیک برای تغییر)" else "انتخاب فایل صوتی برای نیم‌ساعت (پیش‌فرض: تک‌زنگ)"
                      setBackgroundColor(Color.parseColor("#1E293B")); setTextColor(Color.parseColor("#FDE047"))
                      setOnClickListener { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ_HALF) }
                  }

                  val btnFileSalawat = Button(this).apply {
                      val hasFile = p.getString("uri_salawat", null) != null
                      text = if (hasFile) "صدای ساعت ۸ و ۲۰: فایل دلخواه تنظیم شد (کلیک برای تغییر)" else "انتخاب فایل صوتی صلوات خاصه (ساعت ۸ و ۲۰)"
                      setBackgroundColor(Color.parseColor("#1E293B")); setTextColor(Color.parseColor("#34D399"))
                      setOnClickListener { startActivityForResult(Intent(Intent.ACTION_OPEN_DOCUMENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "audio/*" }, REQ_SALAWAT) }
                  }

                  val btnT = Button(this).apply {
                      btnTestRef = this
                      text = "تست صدای ساعت جاری"
                      setBackgroundColor(Color.parseColor("#334155"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          if (HourlyReceiver.isPlaying) {
                              HourlyReceiver.stop()
                              text = "تست صدای ساعت جاری"
                              setBackgroundColor(Color.parseColor("#334155"))
                          } else {
                              val h = Calendar.getInstance().get(Calendar.HOUR_OF_DAY) % 12
                              text = "توقف تست"
                              setBackgroundColor(Color.parseColor("#B91C1C"))
                              HourlyReceiver.play(this@MainActivity, if (h == 0) 12 else h, "uri_hour", "hour") {
                                  runOnUiThread { text = "تست صدای ساعت جاری"; setBackgroundColor(Color.parseColor("#334155")) }
                              }
                          }
                      }
                  }

                  val btnTH = Button(this).apply {
                      text = "تست تک‌‌زنگ نیم‌ساعت"
                      setBackgroundColor(Color.parseColor("#334155"))
                      setTextColor(Color.parseColor("#FDE047"))
                      setOnClickListener {
                          HourlyReceiver.stop()
                          btnTestRef?.text = "تست صدای ساعت جاری"
                          btnTestRef?.setBackgroundColor(Color.parseColor("#334155"))
                          HourlyReceiver.play(this@MainActivity, 1, "uri_half", "half") {}
                      }
                  }

                  val btnTSalawat = Button(this).apply {
                      text = "تست نوای صلوات خاصه (ساعت ۸ و ۲۰)"
                      setBackgroundColor(Color.parseColor("#065F46"))
                      setTextColor(Color.parseColor("#34D399"))
                      setOnClickListener {
                          HourlyReceiver.stop()
                          btnTestRef?.text = "تست صدای ساعت جاری"
                          btnTestRef?.setBackgroundColor(Color.parseColor("#334155"))
                          HourlyReceiver.playSalawat(this@MainActivity)
                      }
                  }

                  ll.addView(t); ll.addView(st); ll.addView(btnToggle); ll.addView(chSalawat); ll.addView(chHalf); ll.addView(cq)
                  ll.addView(spGap); ll.addView(btnFileHour); ll.addView(btnFileHalf); ll.addView(btnFileSalawat)
                  ll.addView(btnT); ll.addView(btnTH); ll.addView(btnTSalawat)
                  sv.addView(ll); setContentView(sv)
              }

              override fun onPause() {
                  super.onPause()
                  HourlyReceiver.stop()
                  btnTestRef?.text = "تست صدای ساعت جاری"
                  btnTestRef?.setBackgroundColor(Color.parseColor("#334155"))
              }

              override fun onActivityResult(req: Int, res: Int, d: Intent?) {
                  super.onActivityResult(req, res, d)
                  if (res == RESULT_OK && d?.data != null) {
                      val uri = d.data!!
                      try { contentResolver.takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION) } catch (_: Exception) {}
                      val p = getSharedPreferences("P", 0).edit()
                      when (req) {
                          REQ_HOUR -> { p.putString("uri_hour", uri.toString()); Toast.makeText(this, "فایل سر ساعت ذخیره شد", Toast.LENGTH_SHORT).show() }
                          REQ_HALF -> { p.putString("uri_half", uri.toString()); Toast.makeText(this, "فایل نیم‌‌ساعت ذخیره شد", Toast.LENGTH_SHORT).show() }
                          REQ_SALAWAT -> { p.putString("uri_salawat", uri.toString()); Toast.makeText(this, "فایل صلوات خاصه ذخیره شد", Toast.LENGTH_SHORT).show() }
                      }
                      p.apply()
                      recreate()
                  }
              }
          }

          class HourlyReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  val pm = c.getSystemService(Context.POWER_SERVICE) as PowerManager
                  val wl = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "HaramClock:ChimeLock")
                  wl.acquire(60000L)
                  try {
                      val tm = c.getSystemService(Context.TELEPHONY_SERVICE) as? TelephonyManager
                      if (tm == null || tm.callState == TelephonyManager.CALL_STATE_IDLE) {
                          val cal = Calendar.getInstance()
                          val h = cal.get(Calendar.HOUR_OF_DAY)
                          val m = cal.get(Calendar.MINUTE)
                          val p = c.getSharedPreferences("P", 0)

                          if (m in 0..4 && (h == 8 || h == 20) && p.getBoolean("salawat_8", true)) {
                              playSalawat(c)
                          } else if (!(p.getBoolean("q", true) && (h >= 23 || h < 7))) {
                              if (m in 25..35) {
                                  if (p.getBoolean("half", true)) play(c, 1, "uri_half", "half") {}
                              } else {
                                  val c12 = h % 12
                                  play(c, if (c12 == 0) 12 else c12, "uri_hour", "hour") {}
                              }
                          }
                      }
                  } finally {
                      sch(c)
                      if (wl.isHeld) wl.release()
                  }
              }

              companion object {
                  @Volatile var isPlaying = false
                  private var currentMp: MediaPlayer? = null
                  private var currentTrack: AudioTrack? = null

                  fun stop() {
                      isPlaying = false
                      try { currentMp?.stop(); currentMp?.release() } catch (_: Exception) {}
                      currentMp = null
                      try { currentTrack?.stop(); currentTrack?.release() } catch (_: Exception) {}
                      currentTrack = null
                  }

                  fun playSalawat(c: Context) {
                      stop()
                      isPlaying = true
                      val p = c.getSharedPreferences("P", 0)
                      val u = p.getString("uri_salawat", null)
                      thread {
                          try {
                              if (u != null) {
                                  val mp = MediaPlayer.create(c, Uri.parse(u))
                                  currentMp = mp; mp?.start()
                                  while (mp != null && mp.isPlaying && isPlaying) Thread.sleep(200)
                                  mp?.release(); currentMp = null
                              } else {
                                  val resId = c.resources.getIdentifier("salawat", "raw", c.packageName)
                                  if (resId != 0) {
                                      val mp = MediaPlayer.create(c, resId)
                                      currentMp = mp; mp?.start()
                                      while (mp != null && mp.isPlaying && isPlaying) Thread.sleep(200)
                                      mp?.release(); currentMp = null
                                  } else {
                                      for (k in 0 until 8) {
                                          if (!isPlaying) break
                                          sndTone(659.25, 500L)
                                      }
                                  }
                              }
                          } catch (_: Exception) {}
                          finally { isPlaying = false }
                      }
                  }

                  fun play(c: Context, r: Int, prefKey: String, rawName: String, onFinish: (() -> Unit)? = null) {
                      stop()
                      isPlaying = true
                      val tm = c.getSystemService(Context.TELEPHONY_SERVICE) as? TelephonyManager
                      if (tm != null && tm.callState != TelephonyManager.CALL_STATE_IDLE) {
                          isPlaying = false; onFinish?.invoke(); return
                      }
                      val p = c.getSharedPreferences("P", 0)
                      val u = p.getString(prefKey, null)
                      val g = p.getLong("gap", 1000L)
                      val rawId = c.resources.getIdentifier(rawName, "raw", c.packageName)

                      thread {
                          try {
                              for (idx in 0 until r) {
                                  if (!isPlaying) break
                                  if (tm != null && tm.callState != TelephonyManager.CALL_STATE_IDLE) break

                                  if (u != null) {
                                      try {
                                          val mp = MediaPlayer.create(c, Uri.parse(u))
                                          currentMp = mp; mp?.start()
                                          val dur = mp?.duration?.toLong() ?: 1000L
                                          var waited = 0L
                                          while (waited < dur + g && isPlaying) { Thread.sleep(100); waited += 100 }
                                          mp?.release(); currentMp = null
                                      } catch (_: Exception) { sndTone(587.33, g) }
                                  } else if (rawId != 0) {
                                      try {
                                          val mp = MediaPlayer.create(c, rawId)
                                          currentMp = mp; mp?.start()
                                          val dur = mp?.duration?.toLong() ?: 1000L
                                          var waited = 0L
                                          while (waited < dur + g && isPlaying) { Thread.sleep(100); waited += 100 }
                                          mp?.release(); currentMp = null
                                      } catch (_: Exception) { sndTone(587.33, g) }
                                  } else {
                                      sndTone(587.33, g)
                                  }
                              }
                          } finally { isPlaying = false; onFinish?.invoke() }
                      }
                  }

                  private fun sndTone(f: Double, g: Long) {
                      val sr = 44100; val dur = 0.8; val n = (dur * sr).toInt(); val b = ShortArray(n)
                      for (i in 0 until n) {
                          val t = i.toDouble() / sr
                          b[i] = (sin(2 * Math.PI * f * t) * Math.exp(-3.5 * t) * 32767).toInt().toShort()
                      }
                      val tr = AudioTrack.Builder()
                          .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build())
                          .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                          .setBufferSizeInBytes(n * 2).setTransferMode(AudioTrack.MODE_STATIC).build()
                      currentTrack = tr; tr.write(b, 0, n); tr.play()
                      var waited = 0L; val totalWait = (dur * 1000).toLong() + g
                      while (waited < totalWait && isPlaying) { Thread.sleep(100); waited += 100 }
                      try { tr.stop(); tr.release() } catch (_: Exception) {}
                      currentTrack = null
                  }

                  fun sch(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      val i = Intent(c, HourlyReceiver::class.java).apply { flags = Intent.FLAG_RECEIVER_FOREGROUND }
                      val pi = PendingIntent.getBroadcast(c, 101, i, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                      val now = Calendar.getInstance()
                      val next = Calendar.getInstance().apply {
                          set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                          if (now.get(Calendar.MINUTE) < 30) set(Calendar.MINUTE, 30)
                          else { add(Calendar.HOUR_OF_DAY, 1); set(Calendar.MINUTE, 0) }
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                          val showPi = PendingIntent.getActivity(c, 102, Intent(c, MainActivity::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                          am.setAlarmClock(AlarmManager.AlarmClockInfo(next.timeInMillis, showPi), pi)
                      } else {
                          am.setExact(AlarmManager.RTC_WAKEUP, next.timeInMillis, pi)
                      }
                  }

                  fun can(c: Context) {
                      val am = c.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                      am.cancel(PendingIntent.getBroadcast(c, 101, Intent(c, HourlyReceiver::class.java), PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE))
                  }
              }
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(c: Context, i: Intent) {
                  if (i.action == Intent.ACTION_BOOT_COMPLETED && c.getSharedPreferences("P", 0).getBoolean("on", false)) {
                      HourlyReceiver.sch(c)
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HaramClock-v2.4-EmbeddedAudio-APK
          path: app/build/outputs/apk/debug/*.apk
